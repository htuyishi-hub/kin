name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    paths:
      - 'artifacts/kin/**'
      - 'lib/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Configure Environment Variables
        run: |
          cat <<EOF > artifacts/kin/.env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}
          EOF

      - name: Prebuild Native Android Project
        working-directory: artifacts/kin
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        working-directory: artifacts/kin/android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kin-android-apk
          path: artifacts/kin/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATHS=$(find artifacts/kin/android/app/build/outputs/apk -name "*.apk" | tr '\n' ' ')
          if [ -n "$APK_PATHS" ]; then
            TAG="v1.0.0-build-$(date +'%Y%m%d%H%M%S')"
            gh release create "$TAG" $APK_PATHS \
              --title "Kin Android App ($TAG)" \
              --notes "Automated Android APK build from GitHub Actions. Download the APK file below and install on your Android device."
          fi
