kind = "mobile"
previewPath = "/"
title = "Kin"
version = "1.0.0"
id = "artifacts/kin"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25286

[services.development]
run = "pnpm --filter @workspace/kin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kin", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kin", "run", "serve" ]

[services.env]
PORT = "25286"
BASE_PATH = "/"
