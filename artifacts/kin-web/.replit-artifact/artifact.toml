kind = "web"
previewPath = "/kin-web/"
title = "Kin — Website"
version = "1.0.0"
id = "artifacts/kin-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/kin-web/" ]
localPort = 20499

[services.development]
run = "pnpm --filter @workspace/kin-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kin-web", "run", "build" ]
publicDir = "artifacts/kin-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20499"
BASE_PATH = "/kin-web/"
